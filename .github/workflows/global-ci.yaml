name: Global CI

on:
  push:
    branches:
    - main
    - 'release-*'
    tags:
    - 'v*'
  pull_request:
    branches:
    - main
    - 'release-*'

env:
  BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.base_ref }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - id: get-tag
        run: |
          echo "Get tag for quay.io/konveyor images"      
          if [[ "${{ env.BRANCH }}" == "main" ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ env.BRANCH }}" >> "$GITHUB_OUTPUT"
          fi
          echo "$(grep tag "$GITHUB_OUTPUT")"

  build-hub:
    name: Build tackle2-hub
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        repository: konveyor/tackle2-hub
        ref: ${{ env.BRANCH }}
        path: tackle2-hub

    - uses: actions/checkout@v6
      with:
        path: tackle2-hub/tackle2-seed

    - name: Build hub and save image
      working-directory: tackle2-hub
      env:
        IMG: ttl.sh/konveyor-hub-${{ github.sha }}:4h
      run: |
        podman build --build-arg SEED_ROOT=/opt/app-root/src/tackle2-seed -t $IMG .
        podman push $IMG

  build-kantra:
    needs: [setup]
    name: Build kantra
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        repository: konveyor/kantra
        ref: ${{ env.BRANCH }}
        path: kantra

    - uses: actions/checkout@v6
      with:
        path: kantra/tackle2-seed

    # ttl.sh requires TTL as tag (:4h), but kantra Dockerfile uses IMAGE without tag.
    # Push :4h for ttl.sh, then push :$IMAGE_TAG for kantra internal use.
    - name: Build kantra and save image
      working-directory: kantra
      env:
        IMAGE_TAG: ${{ needs.setup.outputs.tag }}
        IMG: ttl.sh/konveyor-kantra-${{ github.sha }}
      run: |
        podman build --build-arg IMAGE=$IMG --build-arg VERSION=$IMAGE_TAG -t $IMG:4h .
        podman push $IMG:4h
        podman tag $IMG:4h $IMG:$IMAGE_TAG
        podman push $IMG:$IMAGE_TAG

  e2e:
    needs: [setup, build-hub, build-kantra]
    uses: konveyor/ci/.github/workflows/global-ci-bundle.yml@main
    with:
      # Deploy the freshly-built hub (which bundles this PR's seed) so koncur
      # exercises the seed under test. Do NOT pin operator_bundle here: in
      # global-ci-bundle a pinned operator_bundle takes precedence and deploys
      # the published hub (old bundled seed), so the PR's rules never reach the
      # hub and koncur-hub-tests validate stale rules.
      tackle_hub: ttl.sh/konveyor-hub-${{ github.sha }}:4h
      kantra: ttl.sh/konveyor-kantra-${{ github.sha }}:4h
      run_api_tests: false
      run_koncur_hub_tests: true
      run_koncur_kantra_tests: true
      run_windows_kantra_tests: false
      koncur_ref: ${{ github.event_name == 'push' && github.ref_name || github.base_ref }}
      tackle_cr: |
        kind: Tackle
        apiVersion: tackle.konveyor.io/v1alpha1
        metadata:
          name: tackle
        spec:
          image_pull_policy: IfNotPresent
          analyzer_container_requests_cpu: 100m
          provider_java_container_requests_cpu: 100m
          provider_python_container_requests_cpu: 100m
          feature_auth_required: false
          # Keep the agentic/Kai Solution Server operand disabled: it is not
          # needed to validate the seed and its deployment does not become
          # ready in this e2e env, which otherwise marks the Tackle CR as
          # Failure before koncur runs.
          experimental_deploy_kai: false
          kai_solution_server_enabled: false
          hub_image_fqin: ttl.sh/konveyor-hub-${{ github.sha }}:4h
